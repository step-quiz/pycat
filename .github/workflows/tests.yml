# Test del curs: cada exercici amb la seva solució de referència i els casos de
# prova (tests/comprova-curs.py), i la sintaxi de tots els fitxers JS.
# S'executa a cada canvi a main, a cada pull request i a mà (Actions → Tests →
# Run workflow). No escriu res al repositori.
# Els commits del bot dels ZIP no el disparen per si sols (regla de GitHub):
# per això unzip-upload.yml el llança després de desar.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proves:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test del curs
        run: python3 tests/comprova-curs.py

      - name: Sintaxi dels fitxers JS
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f" || exit 1; done
          echo "Sintaxi correcta a $(git ls-files '*.js' | wc -l) fitxers."

      - name: Documentació ↔ codi
        run: python3 tests/docs_vs_codi.py
