<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyCat — Python al navegador</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Mode embed: aplicat immediatament per evitar flash -->
<script>
  (function() {
    var p = new URLSearchParams(location.search);
    if (p.get('embed') === '1') document.body.classList.add('embed');
    if (p.get('theme') === 'light') document.body.classList.add('light');
  })();
</script>

<!-- ══════════════════════════════════════════════════════
     FILA 1 — Identitat i navegació
     ══════════════════════════════════════════════════════ -->
<header class="topbar">
  <div class="logo">
    <span class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="1.4em" height="1.4em" style="vertical-align:middle"><path fill="#3776AB" d="M53.75,5.42c-27.65,0-31.75,12.5-31.75,12.5v12.75h32.5v4.5H21.25C8.65,35.17,5,44.75,5,56.3c0,12.25,3.75,20.75,17.25,20.75h8.75v-12c0-13.62,11.25-24.87,24.87-24.87h16.13v-16c0-13.5-11-24.3-24.37-24.3C55.03,5.44,54.4,5.42,53.75,5.42z M45.75,15.62c2.62,0,4.75,2.12,4.75,4.75c0,2.62-2.13,4.75-4.75,4.75c-2.63,0-4.75-2.13-4.75-4.75C41,17.75,43.12,15.62,45.75,15.62z"/><path fill="#FFD43B" d="M56.25,104.58c27.65,0,31.75-12.5,31.75-12.5V79.33H55.5v-4.5h33.25c12.6,0,16.25-9.58,16.25-21.13c0-12.25-3.75-20.75-17.25-20.75h-8.75v12c0,13.62-11.25,24.87-24.87,24.87H38v16c0,13.5,11,24.3,24.37,24.3C63.97,104.56,64.6,104.58,56.25,104.58z M64.25,94.38c-2.62,0-4.75-2.12-4.75-4.75c0-2.62,2.13-4.75,4.75-4.75c2.63,0,4.75,2.13,4.75,4.75C69,92.25,66.88,94.38,64.25,94.38z"/></svg></span>
    <span>PyCat</span>
  </div>

  <nav class="topbar-nav">
    <a href="curs/capitol-1.html" class="topbar-nav-link">Capítols</a>
    <a href="curs/repte-1.html" class="topbar-nav-link">Reptes</a>
    <a href="index.html" class="topbar-nav-link active">Simulador</a>
  </nav>

  <div class="topbar-actions">
    <button id="btn-glossari" class="btn-glossari" type="button" aria-label="Glossari">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </button>
  </div>

  <button id="btn-theme"
          class="btn btn-theme"
          onclick="toggleTheme()"
          aria-label="Canvia el tema">
  </button>
</header>


<!-- ══════════════════════════════════════════════════════
     FILA 2 — Controls d'execució
     ══════════════════════════════════════════════════════ -->
<div class="toolbar">
  <button class="btn p" id="btn-run"   onclick="handleRunClick()" aria-label="Executa el programa">▶ Executa</button>
  <button class="btn"   id="btn-reset" onclick="resetConsole()"   aria-label="Neteja la consola">↺ Neteja</button>
  <div class="toolbar-spacer"></div>
  <input type="file" id="file-open-input" accept=".py,.txt" hidden>
  <button class="btn btn-file" id="btn-open" aria-label="Obre un fitxer .py">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/><path d="M12 10v6"/><path d="m9 13 3-3 3 3"/></svg>
    <span class="btn-file-label">Obre</span>
  </button>
  <button class="btn btn-file" id="btn-save" aria-label="Desa com a fitxer .py">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span class="btn-file-label">Desa</span>
  </button>
</div>


<!-- ══════════════════════════════════════════════════════
     ZONA PRINCIPAL — Editor + Consola
     ══════════════════════════════════════════════════════ -->
<div class="main">

  <!-- Columna esquerra: editor de codi -->
  <div class="code-col">
    <div class="editor-wrap">
      <div id="line-numbers"></div>
      <div class="editor-inner">
        <div  id="line-bg"        aria-hidden="true"></div>
        <pre  id="code-highlight" aria-hidden="true"></pre>
        <textarea id="code-editor" spellcheck="false" wrap="off"
                  aria-label="Editor de codi Python" aria-multiline="true"></textarea>
      </div>
      <div id="autocomplete" class="autocomplete-dropdown" role="listbox" aria-label="Autocompletat"></div>
    </div>
  </div>

  <!-- Columna dreta: consola de sortida -->
  <div class="console-col">
    <div class="console-header">
      <span>⬤ Consola</span>
    </div>
    <div class="console-area" role="region" aria-label="Consola de sortida" aria-live="polite">
      <div id="console-output"></div>
    </div>
  </div>

</div>


<!-- ══════════════════════════════════════════════════════
     Glossari (modal)
     ══════════════════════════════════════════════════════ -->
<div class="glossari-overlay" id="glossari-overlay"></div>


<!-- ══════════════════════════════════════════════════════
     Scripts — Ordre de càrrega
     ══════════════════════════════════════════════════════ -->
<script src="js/constants.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/console.js"></script>
<script src="js/editor.js"></script>
<script src="js/pyrunner.js"></script>
<script src="js/ui.js"></script>
<script src="js/kbd-accessory.js"></script>
<script src="js/main.js"></script>
<script src="js/sw-register.js"></script>
<script src="curs/glossari-data.js"></script>
<script src="footer.js"></script>

</body>
</html>
