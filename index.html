<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyCat — Python al navegador</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Mode embed: aplicat immediatament per evitar flash -->
<script>
  (function() {
    var p = new URLSearchParams(location.search);
    if (p.get('embed') === '1') document.body.classList.add('embed');
    if (p.get('theme') === 'light') document.body.classList.add('light');
  })();
</script>

<!-- ══════════════════════════════════════════════════════
     FILA 1 — Identitat i navegació
     ══════════════════════════════════════════════════════ -->
<header class="topbar">
  <div class="logo">
    <span class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="1.4em" height="1.4em" style="vertical-align:middle"><path fill="#3776AB" d="M53.75,5.42c-27.65,0-31.75,12.5-31.75,12.5v12.75h32.5v4.5H21.25C8.65,35.17,5,44.75,5,56.3c0,12.25,3.75,20.75,17.25,20.75h8.75v-12c0-13.62,11.25-24.87,24.87-24.87h16.13v-16c0-13.5-11-24.3-24.37-24.3C55.03,5.44,54.4,5.42,53.75,5.42z M45.75,15.62c2.62,0,4.75,2.12,4.75,4.75c0,2.62-2.13,4.75-4.75,4.75c-2.63,0-4.75-2.13-4.75-4.75C41,17.75,43.12,15.62,45.75,15.62z"/><path fill="#FFD43B" d="M56.25,104.58c27.65,0,31.75-12.5,31.75-12.5V79.33H55.5v-4.5h33.25c12.6,0,16.25-9.58,16.25-21.13c0-12.25-3.75-20.75-17.25-20.75h-8.75v12c0,13.62-11.25,24.87-24.87,24.87H38v16c0,13.5,11,24.3,24.37,24.3C63.97,104.56,64.6,104.58,56.25,104.58z M64.25,94.38c-2.62,0-4.75-2.12-4.75-4.75c0-2.62,2.13-4.75,4.75-4.75c2.63,0,4.75,2.13,4.75,4.75C69,92.25,66.88,94.38,64.25,94.38z"/></svg></span>
    <span>PyCat</span>
  </div>

  <nav class="topbar-nav">
    <a href="curs/capitol-1.html" class="topbar-nav-link">Capítols</a>
    <a href="curs/repte-1.html" class="topbar-nav-link">Reptes</a>
    <a href="index.html" class="topbar-nav-link active">Simulador</a>
  </nav>

  <div class="topbar-actions">
    <div id="state-badge" aria-live="polite">
      <div id="state-dot"></div>
      <span id="state-lbl">carregant…</span>
    </div>
  </div>

  <button id="btn-theme"
          class="btn btn-theme"
          onclick="toggleTheme()"
          aria-label="Canvia el tema">
  </button>
</header>


<!-- ══════════════════════════════════════════════════════
     FILA 2 — Controls d'execució
     ══════════════════════════════════════════════════════ -->
<div class="toolbar">
  <button class="btn p" id="btn-run" onclick="handleRunClick()">▶ Executa</button>
  <button class="btn"   id="btn-reset" onclick="resetConsole()">↺ Neteja</button>
</div>


<!-- ══════════════════════════════════════════════════════
     ZONA PRINCIPAL — Editor + Consola
     ══════════════════════════════════════════════════════ -->
<div class="main">

  <!-- Columna esquerra: editor de codi -->
  <div class="code-col">
    <div class="editor-wrap">
      <div id="line-numbers"></div>
      <div class="editor-inner">
        <div  id="line-bg"        aria-hidden="true"></div>
        <pre  id="code-highlight" aria-hidden="true"></pre>
        <textarea id="code-editor" spellcheck="false" wrap="off"></textarea>
      </div>
    </div>
  </div>

  <!-- Columna dreta: consola de sortida -->
  <div class="console-col">
    <div class="console-header">
      <span>⬤ Consola</span>
    </div>
    <div class="console-area">
      <div id="console-output"></div>
    </div>
  </div>

</div>


<!-- ══════════════════════════════════════════════════════
     Scripts — Ordre de càrrega
     ══════════════════════════════════════════════════════ -->
<script src="js/constants.js"></script>
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/console.js"></script>
<script src="js/editor.js"></script>
<script src="js/pyrunner.js"></script>
<script src="js/ui.js"></script>
<script src="js/kbd-accessory.js"></script>
<script src="js/main.js"></script>
<script src="js/sw-register.js"></script>

</body>
</html>
